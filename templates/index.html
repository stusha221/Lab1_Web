{% extends 'base.html' %}
{% block title %}Загрузка изображения{% endblock %}

{% block content %}
<h1>Поворот изображения</h1>

<form method="post" action="{{ url_for('rotate') }}" enctype="multipart/form-data">
  <label for="image">Изображение</label>
  <input type="file" id="image" name="image" accept="image/*" required>

  <label for="angle">На сколько градусов повернуть?</label>
  <input type="number" id="angle" name="angle"
         min="0" max="360" step="any" value="30" required>

  <label>В какую сторону?</label>
  <div class="radio-row">
    <label class="radio">
      <input type="radio" name="direction" value="right" checked>
      <span>Вправо (по часовой) ↻</span>
    </label>
    <label class="radio">
      <input type="radio" name="direction" value="left">
      <span>Влево (против часовой) ↺</span>
    </label>
  </div>

  <label class="radio" style="margin-top:14px;">
  <input type="checkbox" name="add_stamp">
  <span>Добавить на изображение дату и время</span>
  </label>

  <div class="captcha-box">
    <label for="captcha">Проверка на робота</label>
    <span class="question">{{ captcha_question }} = ?</span>
    <input type="text" id="captcha" name="captcha" inputmode="numeric"
           autocomplete="off" placeholder="Введите ответ" required>
  </div>

  <button type="submit">Повернуть</button>
</form>
{% endblock %}
