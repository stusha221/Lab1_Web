<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Поворот изображения{% endblock %}</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 30px 16px;
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      background: #eef2f7; color: #1f2937;
    }
    .container {
      max-width: 960px; margin: 0 auto;
      background: #fff; border-radius: 14px;
      padding: 28px 32px 36px;
      box-shadow: 0 6px 24px rgba(15, 23, 42, .10);
    }
    h1 { margin-top: 0; font-size: 24px; }
    h2 { font-size: 18px; margin: 28px 0 12px; }
    label { display: block; margin: 18px 0 6px; font-weight: 600; font-size: 14px; }
    input[type=file], input[type=number], input[type=text] {
      width: 100%; padding: 10px 12px; font-size: 15px;
      border: 1px solid #cbd5e1; border-radius: 8px; background: #f8fafc;
    }
    input:focus { outline: 2px solid #2563eb; background: #fff; }
    .radio-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 4px; }
    .radio {
      display: flex; align-items: center; gap: 8px; margin: 0;
      padding: 10px 16px; border: 1px solid #cbd5e1; border-radius: 8px;
      background: #f8fafc; cursor: pointer; font-weight: 500;
    }
    .radio input { margin: 0; }
    button {
      margin-top: 24px; padding: 12px 28px; font-size: 16px; font-weight: 600;
      color: #fff; background: #2563eb; border: 0; border-radius: 8px;
      cursor: pointer; transition: background .15s;
    }
    button:hover { background: #1d4ed8; }
    .flash {
      background: #fee2e2; border-left: 4px solid #dc2626;
      padding: 12px 16px; border-radius: 8px; margin-bottom: 18px; color: #991b1b;
    }
    .flash p { margin: 4px 0; }
    .captcha-box {
      margin-top: 18px; padding: 14px 18px; background: #eff6ff;
      border: 1px dashed #93c5fd; border-radius: 10px;
    }
    .captcha-box .question {
      display: inline-block; font-size: 20px; font-weight: 700;
      letter-spacing: 2px; color: #1e40af; margin-bottom: 8px;
    }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
    @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
    .card {
      border: 1px solid #e2e8f0; border-radius: 10px; padding: 14px;
      background: #fbfdff;
    }
    .card img.preview {
      max-width: 100%; height: auto; display: block; margin: 0 auto;
      border-radius: 6px;
    }
    .card .meta { font-size: 13px; color: #64748b; margin-top: 8px; text-align: center; }
    .hist { width: 100%; height: auto; margin-top: 6px; }
    a.back { display: inline-block; margin-top: 28px; color: #2563eb; text-decoration: none; }
    a.back:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash">
          {% for m in messages %}<p>{{ m }}</p>{% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
